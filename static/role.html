<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>How can we help?</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
    h1 { margin-bottom: 0.5rem; }
    p { color: #555; margin-bottom: 2rem; }
    .options { display: flex; gap: 1rem; }
    .card { padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; text-align: center; border: 2px solid transparent; transition: border-color 0.2s; }
    .card:hover { border-color: #2563eb; }
    .card h2 { margin: 0 0 0.5rem; }
    .card p { margin: 0; font-size: 0.9rem; }
    .btn { margin-top: 2rem; padding: 0.75rem 2.5rem; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; opacity: 0.4; pointer-events: none; }
    .btn.active { opacity: 1; pointer-events: auto; }
    .skip { margin-top: 1rem; background: none; border: none; color: #888; font-size: 0.9rem; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <h1>How can we help?</h1>
  <p>Select what applies to you — you can choose both.</p>
  <div class="options">
    <div class="card" data-role="need" onclick="toggle(this)">
      <h2>🙏 I Need Resources</h2>
      <p>Find food, shelter, supplies, or support near you.</p>
    </div>
    <div class="card" data-role="have" onclick="toggle(this)">
      <h2>🤝 I Have Resources</h2>
      <p>Offer help, supplies, or services to those nearby.</p>
    </div>
  </div>
  <button class="btn" id="continueBtn" onclick="proceed()">Continue</button>
  <button class="skip" onclick="skipToMap()">Skip — just show me the map</button>

  <script>
    // Store token from URL fragment if present
    const hash = window.location.hash;
    if (hash.includes('token=')) {
      const token = hash.split('token=')[1];
      localStorage.setItem('id_token', token);
      history.replaceState(null, '', window.location.pathname);
    }

    const selected = new Set();

    function toggle(card) {
      const role = card.dataset.role;
      if (selected.has(role)) {
        selected.delete(role);
        card.style.borderColor = 'transparent';
      } else {
        selected.add(role);
        card.style.borderColor = '#2563eb';
      }
      document.getElementById('continueBtn').classList.toggle('active', selected.size > 0);
    }

    function proceed() {
      const role = selected.size === 2 ? 'both' : [...selected][0];
      localStorage.setItem('userRole', role);
      window.location.href = '/resources.html';
    }

    function skipToMap() {
      localStorage.setItem('userRole', localStorage.getItem('userRole') || 'both');
      window.location.href = '/map.html';
    }
  </script>
</body>
</html>
